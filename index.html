<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minesweeper</title>
  <style>
    :root { --bg:#f3f6fb; --surface:#ffffff; --ink:#19233a; --muted:#71809b; --line:#e7ebf2; --blue:#3977f6; --blue-2:#e9f0ff; --red:#f05262; --shadow:0 20px 55px rgba(35,57,98,.12); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(140deg,#f8faff 0%,var(--bg) 60%,#edf2fb 100%); color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:grid; place-items:center; padding:28px 18px; }
    .app { width:min(100%,820px); }
    .topbar { display:flex; align-items:center; justify-content:space-between; margin:0 6px 22px; }
    .brand { display:flex; align-items:center; gap:11px; font-size:20px; font-weight:800; letter-spacing:-.6px; }
    .brand-mark { width:32px; height:32px; display:grid; place-items:center; border-radius:10px; color:#fff; background:linear-gradient(135deg,#4d8aff,#2164e8); box-shadow:0 7px 15px #3977f644; font-size:18px; }
    .hint { color:var(--muted); font-size:13px; }
    .game { background:var(--surface); border:1px solid rgba(225,230,239,.9); border-radius:24px; padding:clamp(17px,4vw,30px); box-shadow:var(--shadow); }
    .controls { display:grid; grid-template-columns:1fr auto 1fr; gap:15px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:22px; }
    .stat { display:flex; gap:11px; align-items:center; }
    .stat.right { justify-content:flex-end; }
    .stat-icon { width:36px; height:36px; flex:0 0 36px; border-radius:11px; display:grid; place-items:center; background:#f4f6fa; color:#53637e; }
    .stat-icon svg,.tool-btn svg { width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round; }
    .stat-label { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; }
    .stat-value { font-size:20px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05; }
    .face { appearance:none; border:0; width:51px; height:51px; padding:0; border-radius:17px; cursor:pointer; background:var(--blue-2); color:#2f6eee; font-size:23px; box-shadow:inset 0 0 0 1px #d9e4ff; transition:.18s transform,.18s background; display:grid;place-items:center; }
    .face:hover { transform:translateY(-2px); background:#dce8ff; } .face:active{transform:translateY(0)}
    .settings { display:flex; align-items:center; justify-content:space-between; gap:16px; margin:20px 0 18px; }
    .segmented { padding:4px; background:#f3f5f8; border-radius:11px; display:flex; gap:2px; }
    .segmented button,.tool-btn { border:0; cursor:pointer; font:inherit; font-weight:700; color:#65738d; background:transparent; border-radius:8px; padding:7px 11px; font-size:13px; transition:.15s; }
    .segmented button.active { background:#fff; color:#2866e5; box-shadow:0 2px 7px #43567518; }
    .tools { display:flex; gap:7px; } .tool-btn { display:flex;align-items:center;gap:6px;background:#f3f5f8; padding:8px 11px; } .tool-btn.active { background:#ffe7e9; color:#dc3d50; }
    .board-shell { position:relative; padding:clamp(7px,2vw,13px); background:#eef2f8; border-radius:18px; box-shadow:inset 0 1px 2px #cbd3e033; overflow:auto; }
    #board { width:max-content; margin:auto; display:grid; gap:4px; }
    .cell { width:clamp(25px,5.7vw,42px); aspect-ratio:1; border:0; border-radius:9px; color:var(--ink); background:linear-gradient(145deg,#fff,#f5f7fb); box-shadow:0 2px 4px #7b8ba51f,inset 0 1px #fff; cursor:pointer; font-size:clamp(14px,3vw,19px); font-weight:850; line-height:1; transition:transform .1s,background .12s; user-select:none; }
    .cell:hover:not(.open) { transform:translateY(-1px); background:#fff; box-shadow:0 5px 9px #63769525; }
    .cell.open { cursor:default; background:#e6ebf2; box-shadow:inset 0 1px 2px #bcc6d255; }
    .cell.flagged { background:#fff6e9; } .cell.mine { background:#ffe3e5; color:#d63247; } .cell.exploded { background:#f05b6b; color:#fff; } .cell.wrong { background:#fff1f2; color:#e54b5d; }
    .n1{color:#3977f6}.n2{color:#19a56d}.n3{color:#ec5b3e}.n4{color:#8650c8}.n5{color:#b33b55}.n6{color:#1a9aad}.n7{color:#38445a}.n8{color:#67738b}
    .message { min-height:24px; text-align:center; color:var(--muted); font-size:13px; font-weight:600; padding-top:16px; }
    .message.win { color:#14935e; } .message.loss { color:#dd3c50; }
    .outcome { position:absolute; inset:0; z-index:3; display:grid; place-items:center; padding:22px; border-radius:18px; background:rgba(245,248,253,.72); backdrop-filter:blur(5px); opacity:0; pointer-events:none; transition:opacity .24s ease; }
    .outcome.visible { opacity:1; pointer-events:auto; }
    .outcome-card { width:min(100%,300px); text-align:center; padding:24px 20px 20px; border-radius:19px; background:#fff; border:1px solid #eef1f6; box-shadow:0 16px 40px rgba(35,55,93,.2); transform:translateY(8px) scale(.97); transition:.28s cubic-bezier(.2,.8,.2,1); }
    .outcome.visible .outcome-card { transform:translateY(0) scale(1); }
    .outcome-orb { width:54px;height:54px;margin:0 auto 12px;display:grid;place-items:center;border-radius:17px;background:#ffe5e8;color:#dd3c50;box-shadow:inset 0 0 0 1px #ffd0d6;font-size:25px; }
    .outcome.win .outcome-orb { background:#e1f8ec;color:#14935e;box-shadow:inset 0 0 0 1px #c8f0da; }
    .outcome h2 { margin:0 0 5px; font-size:20px; letter-spacing:-.5px; }.outcome p{margin:0 0 17px;color:#77849a;font-size:13px;line-height:1.45}.outcome-actions{display:flex;justify-content:center;gap:8px}.restart,.review { border:0; border-radius:10px; padding:10px 14px; cursor:pointer; font:inherit; font-size:13px;font-weight:800; }.restart { background:linear-gradient(135deg,#4d8aff,#2164e8); color:#fff;box-shadow:0 7px 15px #3977f640; }.restart:hover{filter:brightness(1.05)}.review{background:#f1f4f9;color:#53627c}.review:hover{background:#e8edf5}
    .instructions { text-align:center; color:#8a96aa; font-size:12px; margin-top:18px; }
    @media(max-width:520px){ body{padding:14px 10px}.topbar{margin:0 3px 14px}.hint{display:none}.game{border-radius:19px;padding:15px}.controls{gap:8px;padding-bottom:16px}.stat{gap:7px}.stat-icon{width:31px;height:31px;flex-basis:31px}.stat-value{font-size:18px}.face{width:45px;height:45px}.settings{margin:15px 0}.segmented button{padding:6px 8px}.cell{border-radius:7px}.board-shell{border-radius:13px} }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span class="brand-mark">✦</span> Minesweeper</div><span class="hint">A little focus goes a long way.</span></header>
    <section class="game" aria-label="Minesweeper game">
      <div class="controls">
        <div class="stat"><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg></span><div><div class="stat-label">Mines left</div><div class="stat-value" id="mines">10</div></div></div>
        <button class="face" id="newGame" aria-label="Start a new game" title="New game">🙂</button>
        <div class="stat right"><div><div class="stat-label">Time</div><div class="stat-value" id="timer">000</div></div><span class="stat-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg></span></div>
      </div>
      <div class="settings">
        <div class="segmented" aria-label="Difficulty">
          <button data-level="easy" class="active">Easy</button><button data-level="medium">Medium</button><button data-level="hard">Hard</button>
        </div>
        <div class="tools"><button class="tool-btn" id="flagMode" title="Toggle flag mode" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M7 5c4-2 6 2 11 0v9c-5 2-7-2-11 0"/></svg><span>Flag</span></button></div>
      </div>
      <div class="board-shell"><div id="board" role="grid" aria-label="Minesweeper board"></div><div class="outcome" id="outcome" aria-live="polite"><div class="outcome-card"><div class="outcome-orb" id="outcomeIcon">✹</div><h2 id="outcomeTitle">Game over</h2><p id="outcomeText">A mine caught you this time.</p><div class="outcome-actions"><button class="review" id="review">Review board</button><button class="restart" id="restart">Restart</button></div></div></div></div>
      <div class="message" id="message">Choose a square to begin</div>
    </section>
    <div class="instructions">Click to reveal · Right-click or use Flag mode to mark a mine</div>
  </main>
  <script>
    const levels={easy:{rows:9,cols:9,mines:10},medium:{rows:12,cols:12,mines:24},hard:{rows:14,cols:14,mines:40}};
    let level='easy', grid=[], started=false, over=false, flagged=0, seconds=0, interval, flagMode=false;
    const board=document.querySelector('#board'), mineOut=document.querySelector('#mines'), timer=document.querySelector('#timer'), message=document.querySelector('#message'), face=document.querySelector('#newGame'), flagBtn=document.querySelector('#flagMode'), outcome=document.querySelector('#outcome'), outcomeIcon=document.querySelector('#outcomeIcon'), outcomeTitle=document.querySelector('#outcomeTitle'), outcomeText=document.querySelector('#outcomeText'), reviewBtn=document.querySelector('#review');
    function updateFace(state){const cleared=grid.flat().filter(c=>c.open&&!c.mine).length, safe=grid.length?grid.flat().filter(c=>!c.mine).length:0, remaining=safe-cleared, almostClear=started&&remaining>0&&remaining<=Math.max(3,Math.ceil(safe*.1)); face.textContent=state==='lost'?'😵':state==='won'?'🥳':almostClear?'🤩':safe&&cleared>=safe/2?'😎':'🙂';face.title=state==='lost'||state==='won'?'Start a new game':almostClear?`${remaining} safe square${remaining===1?'':'s'} left — almost there!`:cleared>=safe/2?'Halfway there — new game':'Start a new game'}
    function newGame(){ clearInterval(interval); const s=levels[level]; grid=Array.from({length:s.rows},(_,r)=>Array.from({length:s.cols},(_,c)=>({r,c,mine:false,open:false,flag:false,count:0}))); started=over=false;flagged=seconds=0;timer.textContent='000';message.textContent='Choose a square to begin';message.className='message';outcome.className='outcome'; board.style.gridTemplateColumns=`repeat(${s.cols}, minmax(25px, 42px))`; render(); updateMineCount();updateFace(); }
    function start(first){ const s=levels[level]; let safe=new Set(); for(let r=Math.max(0,first.r-1);r<=Math.min(s.rows-1,first.r+1);r++)for(let c=Math.max(0,first.c-1);c<=Math.min(s.cols-1,first.c+1);c++)safe.add(r+','+c); let placed=0; while(placed<s.mines){let r=Math.floor(Math.random()*s.rows),c=Math.floor(Math.random()*s.cols);if(!grid[r][c].mine&&!safe.has(r+','+c)){grid[r][c].mine=true;placed++}}; grid.flat().forEach(cell=>cell.count=neighbors(cell).filter(n=>n.mine).length); started=true;interval=setInterval(()=>{seconds++;timer.textContent=String(seconds).padStart(3,'0')},1000); }
    function neighbors(cell){const s=levels[level], arr=[];for(let r=cell.r-1;r<=cell.r+1;r++)for(let c=cell.c-1;c<=cell.c+1;c++)if(r>=0&&c>=0&&r<s.rows&&c<s.cols&&(r!==cell.r||c!==cell.c))arr.push(grid[r][c]);return arr}
    function reveal(cell){if(over||cell.open||cell.flag)return;if(!started)start(cell);cell.open=true;if(cell.mine){lose(cell);return}if(cell.count===0)neighbors(cell).forEach(reveal);if(grid.flat().filter(c=>!c.mine).every(c=>c.open))win();render();updateFace()}
    function toggleFlag(cell){if(over||cell.open)return;cell.flag=!cell.flag;flagged+=cell.flag?1:-1;render();updateMineCount()}
    function showOutcome(kind){const won=kind==='win';outcome.className='outcome visible '+(won?'win':'');outcomeIcon.textContent=won?'✦':'✹';outcomeTitle.textContent=won?'Board cleared!':'Game over';outcomeText.textContent=won?`You cleared the field in ${String(seconds).padStart(3,'0')} seconds.`:'Review your board or give it another go.';reviewBtn.hidden=won}
    function lose(cell){over=true;clearInterval(interval); grid.flat().forEach(c=>{if(c.mine)c.open=true;if(c.flag&&!c.mine)c.wrong=true});cell.exploded=true;message.textContent='Boom! Try another run.';message.className='message loss';render();updateFace('lost');showOutcome('loss')}
    function win(){over=true;clearInterval(interval);grid.flat().forEach(c=>{if(c.mine)c.flag=true});flagged=levels[level].mines;message.textContent='Board cleared — beautiful work!';message.className='message win';updateMineCount();updateFace('won');showOutcome('win')}
    function render(){board.innerHTML='';grid.flat().forEach(cell=>{let b=document.createElement('button');b.className='cell'+(cell.open?' open':'')+(cell.flag?' flagged':'')+(cell.mine&&cell.open?' mine':'')+(cell.exploded?' exploded':'')+(cell.wrong?' wrong':'');b.setAttribute('role','gridcell');b.setAttribute('aria-label',`Row ${cell.r+1}, column ${cell.c+1}`);if(cell.wrong)b.textContent='×';else if(cell.flag)b.textContent='⚑';else if(cell.open&&cell.mine)b.textContent='✹';else if(cell.open&&cell.count){b.textContent=cell.count;b.classList.add('n'+cell.count)}b.onclick=()=>flagMode?toggleFlag(cell):reveal(cell);b.oncontextmenu=e=>{e.preventDefault();toggleFlag(cell)};board.appendChild(b)})}
    function updateMineCount(){mineOut.textContent=String(Math.max(0,levels[level].mines-flagged)).padStart(2,'0')}
    document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('[data-level]').forEach(x=>x.classList.toggle('active',x===b));newGame()});
    face.onclick=newGame;document.querySelector('#restart').onclick=newGame;reviewBtn.onclick=()=>{outcome.className='outcome';message.textContent='Review the board — the × marks an incorrect flag.';message.className='message loss'};flagBtn.onclick=()=>{flagMode=!flagMode;flagBtn.classList.toggle('active',flagMode);flagBtn.setAttribute('aria-pressed',flagMode);flagBtn.querySelector('span').textContent=flagMode?'Flagging':'Flag'};
    newGame();
  </script>
</body>
</html>
